# Render Blueprint — EDTECH backend (Express + MongoDB)
# Deploy: Render dashboard → New → Blueprint → connect this repo.
# MONGODB_URI is asked for during setup (use a MongoDB Atlas connection string).
services:
  - type: web
    name: edtech-be
    runtime: node
    branch: test
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # The web service never generates questions: generation blocks the event
      # loop and can OOM the free instance. The committed dataset loads
      # automatically at startup; generate locally or in a one-off job instead.
      - key: SEED_QUESTIONS_PER_TOPIC
        value: "0"
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
      - key: AUTH_SECRET
        generateValue: true
